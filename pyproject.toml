[project]
name = "crypto-alpha-python"
version = "0.1.0"
description = "A high-performance crypto market alpha engine with real-time data processing and analysis"
authors = [
    { name = "tadeasf", email = "business@tadeasfort.com" }
]
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.27.1",
    "sqlmodel>=0.0.16",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "binance-connector>=3.12.0",
    "coinbase-advanced-py>=0.3.0",
    "websockets>=12.0",
    "redis>=5.0.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.21.1",
    "pandas>=2.2.0",
    "numpy>=1.26.3",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.1",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",
    "greenlet==3.1.1",
    "aiohttp>=3.11.16",
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.rye]
managed = true
dev-dependencies = [
    "ruff>=0.11.2",
    "ruff-lsp>=0.0.62",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.1.1",
    "isort>=5.13.2",
    "mypy>=1.8.0",
]

[tool.rye.scripts]
start = "uvicorn crypto_alpha_python.main:app --host 0.0.0.0 --port 8000 --reload"
start-prod = "uvicorn crypto_alpha_python.main:app --host 0.0.0.0 --port 8000"
test = "pytest"
lint = "ruff check ."
format = "black . && isort ."
type-check = "mypy ."

[tool.pdm]
distribution = true
